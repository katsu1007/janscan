name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          set -o pipefail
          xcodebuild -project JanScanner.xcodeproj \
            -scheme JanScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Check Info.plist
        run: |
          P=build/Build/Products/Release-iphoneos/JanScanner.app/Info.plist
          plutil -p "$P"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$P"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$P"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/JanScanner.app Payload/
          zip -qr JanScanner.ipa Payload

      - name: Upload IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JanScanner-ipa
          path: JanScanner.ipa

      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JanScanner build ${{ github.run_number }}
          files: JanScanner.ipa
          make_latest: true
